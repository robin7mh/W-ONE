# The desktop app for Windows and Linux, built on their own runners (node-pty
# is compiled on Linux, so each architecture builds on its own machine).
# Releases (tags v*) get the installers and the auto-update feeds attached;
# a manual run keeps them as workflow artifacts. macOS: npm run dist:mac
# (signing and notarization need the Developer ID — see electron-builder.yml).
name: Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64 + arm64)
            os: windows-latest
            target: --win --x64 --arm64
          - name: Linux x64
            os: ubuntu-latest
            target: --linux --x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: --linux --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (Mindeck Cloud baked in)
        run: npm run build
        env:
          MINDECK_CLOUD_URL: ${{ vars.MINDECK_CLOUD_URL }}
          MINDECK_CLOUD_KEY: ${{ secrets.MINDECK_CLOUD_KEY }}
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          retention-days: 14
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
