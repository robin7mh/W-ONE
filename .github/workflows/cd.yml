# Merges (push to main/develop) and releases (tags v*) build and publish —
# without re-running tests: every change already passed CI on its pull request.
name: CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/w-one

jobs:
  image:
    name: Web image → GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # develop → :develop, main → :main, v1.2.3 → :1.2.3 :1.2 :latest, plus :sha-<short>
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Build the web bundle
        run: |
          npm ci --ignore-scripts
          npm run web:build
          tar -czf w-one-web-${GITHUB_REF_NAME}.tar.gz -C out/web .
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: w-one-web-*.tar.gz
          body: |
            Docker image: `${{ env.IMAGE }}:latest` (also tagged with this version)
