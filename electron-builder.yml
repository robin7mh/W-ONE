# Packaging the desktop app:
#   npm run dist:mac     DMG + ZIP for Apple silicon and Intel (on a Mac)
#   npm run dist:win     NSIS installer for x64 and arm64 (on Windows — .github/workflows/desktop.yml)
#   npm run dist:linux   AppImage + .deb for the machine's architecture (on Linux — node-pty is compiled there)
# Release builds need, as environment variables:
#   MINDECK_CLOUD_URL / MINDECK_CLOUD_KEY  where Mindeck Cloud lives (baked in by electron-vite)
#   CSC_LINK / CSC_KEY_PASSWORD      "Developer ID Application" certificate (.p12, base64 or path)
#   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER   notarization (or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID)
#   GH_TOKEN                         publishing to GitHub Releases (auto-update feed)
appId: de.mindeck.desktop
productName: Mindeck
copyright: © 2026 Robin Hinkelmann
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  # Bundled into the renderer by Vite — not needed again as node_modules.
  - "!node_modules/{monaco-editor,react,react-dom,framer-motion,lucide-react,@xterm,d3-force,marked,dompurify,zustand,qrcode,@fontsource,@fontsource-variable}/**"
  - "!node_modules/node-pty/{src,deps,scripts,typings,binding.gyp}/**"
  - "!**/*.{map,md,d.ts}"
  # The editor's TypeScript service needs its standard library declarations.
  - node_modules/typescript/lib/*.d.ts

# node-pty ships N-API prebuilds for macOS and Windows (stable across Electron versions): nothing
# to compile. Linux has none: `npm ci` builds it there (node-gyp), and N-API keeps that build valid
# for Electron. Each platform keeps only its own prebuilds (build/afterPack.cjs).
npmRebuild: false
afterPack: build/afterPack.cjs
asarUnpack:
  - node_modules/node-pty/**
  # tsserver runs as its own Node process and reads its lib files from disk.
  - node_modules/typescript/**
  # Run as a Node program of its own (Dev Containers).
  - node_modules/@devcontainers/cli/**
  # Mindeck's Prettier, for projects without one (run by the lint worker).
  - node_modules/prettier/**

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: '13.0'
  extendInfo:
    NSHumanReadableCopyright: © 2026 Robin Hinkelmann

dmg:
  # Same name in every release: the website links releases/latest/download/Mindeck-<arch>.dmg
  artifactName: ${productName}-${arch}.${ext}
  title: ${productName} ${version}
  background: build/background.png
  iconSize: 96
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png
  executableName: Mindeck

nsis:
  # Same name in every release, like the DMG: releases/latest/download/Mindeck-Setup-<arch>.exe
  artifactName: ${productName}-Setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}

linux:
  target:
    - target: AppImage
    - target: deb
  icon: build/icon.png
  category: Development
  executableName: mindeck
  # The window belongs to mindeck.desktop (package.json desktopName): docks group and pin it right.
  syncDesktopName: true
  synopsis: Command center for code, agents and projects
  description: Mindeck — editor, terminal, agents, memory and projects in one app.
  maintainer: Robin Hinkelmann <robin.hinkelmann@webma.one>
  desktop:
    entry:
      StartupWMClass: Mindeck

appImage:
  artifactName: ${productName}-${arch}.${ext}

deb:
  artifactName: ${productName}-${arch}.${ext}

publish:
  provider: github
  owner: robin7mh
  repo: mindeck
  releaseType: release
