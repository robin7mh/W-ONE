# Packaging the desktop app: npm run dist:mac (DMG + ZIP for Apple silicon and Intel).
# Release builds need, as environment variables:
#   WONE_CLOUD_URL / WONE_CLOUD_KEY  where W-ONE Cloud lives (baked in by electron-vite)
#   CSC_LINK / CSC_KEY_PASSWORD      "Developer ID Application" certificate (.p12, base64 or path)
#   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER   notarization (or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID)
#   GH_TOKEN                         publishing to GitHub Releases (auto-update feed)
appId: com.robin7mh.wone
productName: W-ONE
copyright: © 2026 Robin Hinkelmann
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  # Bundled into the renderer by Vite — not needed again as node_modules.
  - "!node_modules/{monaco-editor,react,react-dom,framer-motion,lucide-react,@xterm,d3-force,marked,dompurify,zustand,qrcode,@fontsource,@fontsource-variable}/**"
  - "!node_modules/node-pty/{src,deps,scripts,typings,binding.gyp}/**"
  - "!node_modules/node-pty/prebuilds/win32-*/**"
  - "!**/*.{map,md,d.ts}"

# node-pty ships N-API prebuilds (stable across Electron versions): nothing to compile.
npmRebuild: false
asarUnpack:
  - node_modules/node-pty/**

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: '13.0'
  extendInfo:
    NSHumanReadableCopyright: © 2026 Robin Hinkelmann

dmg:
  # Same name in every release: the website links releases/latest/download/W-ONE-<arch>.dmg
  artifactName: ${productName}-${arch}.${ext}
  title: ${productName} ${version}
  background: build/background.png
  iconSize: 96
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications

publish:
  provider: github
  owner: robin7mh
  repo: W-ONE
  releaseType: release
